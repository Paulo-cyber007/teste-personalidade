
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil Psicológico</title>
<style>
body{font-family:Arial;background:#f1f3f8;margin:0;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:12px}
h1{color:#354b75;font-size:25px}
input,select,button{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
.pergunta{margin:18px 0}
button{background:#354b75;color:white;border:0;border-radius:5px;cursor:pointer}
.privacidade{font-size:9px;color:#888;margin-top:15px}
#resultado{font-weight:bold;color:#354b75}
</style>
</head>
<body>
<main>
<h1>Descubra o seu Perfil Psicológico</h1>
<p>Responda às perguntas para descobrir o seu perfil.</p>

<form id="teste">
<input type="text" placeholder="Nome" required>
<input type="email" placeholder="E-mail" required>
<label>Data de nascimento:</label>
<input type="date" required>

<div class="pergunta">1. Como lida com problemas?
<select required><option value="">Escolha...</option>
<option>Analiso com calma</option><option>Peço ajuda</option><option>Ajo rapidamente</option></select></div>

<div class="pergunta">2. Como prefere passar o tempo?
<select required><option value="">Escolha...</option>
<option>Com amigos</option><option>Sozinho</option><option>Depende do dia</option></select></div>

<div class="pergunta">3. Como reage a mudanças?
<select required><option value="">Escolha...</option>
<option>Adapto-me facilmente</option><option>Fico preocupado</option><option>Gosto de novidades</option></select></div>

<div class="pergunta">4. Como toma decisões?
<select required><option value="">Escolha...</option>
<option>Com lógica</option><option>Com emoção</option><option>Peço opiniões</option></select></div>

<div class="pergunta">5. Como se descreve?
<select required><option value="">Escolha...</option>
<option>Calmo</option><option>Extrovertido</option><option>Reservado</option></select></div>

<div class="privacidade">
<label><input type="checkbox" required style="width:auto">
Li e aceito os Termos de Uso e a Política de Privacidade. Autorizo a recolha e o tratamento dos meus dados pessoais para a realização deste teste.</label>
</div>

<button type="submit">Ver Resultado</button>
</form>
<p id="resultado"></p>
</main>

<script>
document.getElementById("teste").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("resultado").textContent=
"Teste concluído! O seu perfil revela características únicas. Este resultado é apenas indicativo.";
});
</script>
</body>
</html>
